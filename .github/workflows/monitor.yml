name: Monitoramento Solicitações AppSheet

on:
  schedule:
    # Executa a cada 5 minutos (24/7 na nuvem)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite testar manualmente

permissions:
  contents: write # Permissão para salvar histórico de tickets

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Robô de Monitoramento
        run: node monitor.js

      - name: Salvar histórico de tickets no repositório
        run: |
          git config --global user.name "Robo AppSheet Z-API"
          git config --global user.email "bot@ajborges.com"
          git add notified_tickets.json
          if git diff --staged --quiet; then
            echo "Nenhum novo ticket para salvar no histórico."
          else
            git commit -m "Auto: Atualiza histórico de tickets notificados [skip ci]"
            git push
          fi
